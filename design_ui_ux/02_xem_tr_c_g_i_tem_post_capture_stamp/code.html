<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Chi Tiết Ký Ức - InkStamp Preview</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Be Vietnam Pro -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
            mono: ['"Space Mono"', 'monospace'],
          },
          colors: {
            surface: '#f9f9f6',
            ink: '#1d1d1b',
            stampPaper: '#fbfaf7',
          }
        }
      }
    }
  </script>
<!-- BEGIN: CSS Stylesheets -->
<style data-purpose="base-layout">
    body {
      background-color: #ecece8;
      color: #1d1d1b;
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Device simulation wrapper (390px iPhone viewport) */
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: #f9f9f6;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
      position: relative;
      margin: 0 auto;
      overflow-x: hidden;
    }
  </style>
<style data-purpose="stamp-perforation">
    /* Physical Stamp Perforated Edge via radial mask */
    .stamp-container {
      position: relative;
      background-color: #faf9f5;
      padding: 14px 14px 18px 14px;
      filter: drop-shadow(0 6px 16px rgba(40, 35, 25, 0.09)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.05));
      /* CSS Perforated edges */
      --hole-radius: 5px;
      --hole-spacing: 15px;
      mask-image: 
        radial-gradient(circle var(--hole-radius) at var(--hole-radius) 50%, transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at calc(100% - var(--hole-radius)) 50%, transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at 50% var(--hole-radius), transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at 50% calc(100% - var(--hole-radius)), transparent 98%, black 100%);
      mask-size: 100% var(--hole-spacing), 100% var(--hole-spacing), var(--hole-spacing) 100%, var(--hole-spacing) 100%;
      mask-position: 0 0, 0 0, 0 0, 0 0;
      mask-repeat: repeat-y, repeat-y, repeat-x, repeat-x;
      mask-composite: intersect;
      -webkit-mask-image: 
        radial-gradient(circle var(--hole-radius) at 0px 50%, transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at 100% 50%, transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at 50% 0px, transparent 98%, black 100%),
        radial-gradient(circle var(--hole-radius) at 50% 100%, transparent 98%, black 100%);
      -webkit-mask-size: 100% var(--hole-spacing), 100% var(--hole-spacing), var(--hole-spacing) 100%, var(--hole-spacing) 100%;
      -webkit-mask-position: 0 0, 0 0, 0 0, 0 0;
      -webkit-mask-repeat: repeat-y, repeat-y, repeat-x, repeat-x;
      -webkit-mask-composite: source-in;
    }

    /* Tactile Paper Texture Grain Overlay */
    .paper-texture {
      background-image: radial-gradient(#1d1d1b 0.6px, transparent 0.6px);
      background-size: 10px 10px;
      opacity: 0.035;
    }
  </style>
<!-- END: CSS Stylesheets -->
</head>
<body class="flex justify-center items-center min-h-screen">
<!-- BEGIN: MobileDeviceContainer -->
<main class="mobile-frame flex flex-col justify-between pb-8 pt-3 select-none">
<!-- BEGIN: TopBar -->
<header class="w-full px-5 pt-3 pb-1 flex items-center justify-between z-20">
<!-- Subtle Back Button -->
<button aria-label="Quay lại máy ảnh" class="w-9 h-9 -ml-1 rounded-full flex items-center justify-center text-ink/80 hover:text-ink active:scale-90 transition-transform cursor-pointer" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<!-- Understated Minimal Title Pill -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-black/[0.04] border border-black/[0.06]">
<span class="font-mono text-[10px] tracking-widest text-[#78756c] uppercase">INKSTAMP</span>
<span class="text-[#78756c]/50 text-xs">/</span>
<h1 class="text-[12.5px] font-medium tracking-tight text-ink lowercase">chi tiết ký ức</h1>
</div>
<!-- Subtle Profile Indicator -->
<div class="w-9 h-9 -mr-1 flex items-center justify-end">
<div class="w-7 h-7 rounded-full overflow-hidden ring-1 ring-black/10 bg-neutral-200">

</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainStampHeroArea -->
<section class="w-full px-4 pt-1 pb-2 flex flex-col items-center justify-center">
<!-- Physical Postage Stamp Object -->
<div class="relative w-full max-w-[340px] drop-shadow-[0_10px_20px_rgba(29,29,27,0.12)] select-none">

    <!-- Subtle paper grain texture -->
    <div class="absolute inset-0 paper-texture pointer-events-none opacity-80"></div>
    
    <!-- Fine inner border framing mimicking collectible philatelic stamps -->
    <div class="relative w-full border border-[#23201a]/20 p-[4px] bg-[#f7f5ee] rounded-[1px]">
      <!-- Photo container with inner shadow -->
      <div class="relative w-full aspect-[3/3.8] overflow-hidden bg-neutral-900 rounded-[1px] shadow-inner">
        <img alt="Khoảnh khắc quán cà phê" class="w-full h-full object-cover select-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD7rcsXio6GpHJwKRo3rLBR7AlXss425hY1W8nVEhKAb3OLbwdn-6vpu_R8qgMXpHer-SzZnt7MHz6AysbeAEwiyJCPQQidRBjBD_SFK6tn--Md-m9YvlJwUw_MqRRx9zsFNE7wNySkH2Vu_fMCCkrMwvyHvLu_u9LtXo1_JnshSrm-lAnWHAZuXX7uWJmVSjQZI3xpKsOWIbGr6YhPI57pk40MGkgwwmUOeQlWm2JxanfbK4MsdND6PQ">
        
        <!-- 4 Corner Tick Marks inside photo -->
        <span class="absolute top-1.5 left-1.5 w-2 h-2 border-t-[1.5px] border-l-[1.5px] border-white/80 pointer-events-none"></span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 border-t-[1.5px] border-r-[1.5px] border-white/80 pointer-events-none"></span>
        <span class="absolute bottom-1.5 left-1.5 w-2 h-2 border-b-[1.5px] border-l-[1.5px] border-white/80 pointer-events-none"></span>
        <span class="absolute bottom-1.5 right-1.5 w-2 h-2 border-b-[1.5px] border-r-[1.5px] border-white/80 pointer-events-none"></span>
        
        <!-- Top Stamp Live Pill -->
        <aside class="absolute top-2.5 left-2.5 bg-black/60 backdrop-blur-md text-white px-2.5 py-0.5 rounded-full flex items-center gap-1.5 shadow-sm border border-white/10">
          <span class="w-1.5 h-1.5 rounded-full bg-[#f59e0b] shadow-[0_0_5px_#f59e0b] animate-pulse"></span>
          <span class="text-[9px] font-mono font-medium tracking-widest uppercase">PARIS · 15:42</span>
        </aside>
        
        <!-- Circular Postal Cancellation Postmark (Dấu bưu chính Hà Nội) -->
        <div class="absolute -top-1 -right-1 w-28 h-28 pointer-events-none select-none opacity-85 rotate-[-12deg]">
          <svg class="w-full h-full text-[#2c2822] drop-shadow-[0_1px_1px_rgba(255,255,255,0.3)]" viewBox="0 0 100 100">
            <circle cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="3, 2.5" stroke-width="1.1"></circle>
            <circle cx="50" cy="50" fill="none" r="37" stroke="currentColor" stroke-width="0.75"></circle>
            <path d="M 18,50 A 32,32 0 0,1 82,50" fill="none" id="stampSealTop"></path>
            <path d="M 82,51.5 A 32,32 0 0,1 18,51.5" fill="none" id="stampSealBottom"></path>
            <text class="text-[8px] font-mono tracking-[0.18em] fill-current uppercase">
              <textPath href="#stampSealTop" startOffset="50%" text-anchor="middle">BƯU CHÍNH HÀ NỘI</textPath>
            </text>
            <text class="text-[7.5px] font-mono tracking-[0.16em] fill-current uppercase">
              <textPath href="#stampSealBottom" startOffset="50%" text-anchor="middle">ĐÃ ĐÓNG DẤU</textPath>
            </text>
            <line stroke="currentColor" stroke-width="0.65" x1="28" x2="72" y1="45" y2="45"></line>
            <text class="text-[9px] font-mono font-bold fill-current tracking-wider" text-anchor="middle" x="50" y="52.5">26.09.2026</text>
            <line stroke="currentColor" stroke-dasharray="2, 1.2" stroke-width="0.65" x1="28" x2="72" y1="58.5" y2="58.5"></line>
          </svg>
        </div>
        
        <!-- Action Buttons inside bottom of photo -->
        <button aria-label="Hủy và chụp lại" class="absolute bottom-2.5 left-2.5 w-11 h-11 rounded-xl bg-black/55 hover:bg-black/70 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow-lg active:scale-95 transition-all cursor-pointer" title="Hủy / Chụp lại" type="button">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
        <button aria-label="Xác nhận và gửi ngay" class="absolute bottom-2.5 right-2.5 w-11 h-11 rounded-xl bg-[#1d1d1b] hover:bg-black border border-white/30 text-white flex items-center justify-center shadow-2xl ring-2 ring-white/25 active:scale-95 transition-all cursor-pointer" title="Gửi ngay 1 chạm" type="button">
          <span class="material-symbols-outlined text-[22px] font-bold text-white">check</span>
        </button>
      </div>
      
      <!-- Authentic Printed Metadata Strip directly on the stamp paper margin -->
      <div class="mt-2 px-1 pt-0.5 border-t border-[#23201a]/15 flex flex-col gap-0.5 text-[8.5px] font-mono text-[#5f5d54] uppercase select-none">
        <div class="flex items-center justify-between font-semibold tracking-wider text-ink">
          <span class="">INKSTAMP · VIETNAM</span>
          <span class="">TEM #142 · HN-026 · 26.09.2026</span>
        </div>
        <div class="flex items-center justify-between text-[7.5px] tracking-widest text-[#78756c]">
          <span class="">KHOẢNH KHẮC THẬT · KHÔNG QUA CHỈNH SỬA</span>
          <span class="">35MM · F/2.0 · 1/500S</span>
        </div>
      </div>
    </div>
  </article>
</div>
<!-- Technical Meta & Privacy Note Directly Under Stamp -->
<div class="mt-2 w-full max-w-[348px] px-2 flex items-center justify-between text-[10.5px] font-mono text-[#8a877d]">
<div class="flex items-center gap-1.5 tracking-tight">

<span class="">CROP 3:4</span>

<div class="flex items-center gap-1 text-[11px] font-sans text-[#78756c]">

<span class="font-normal text-[11px]">Chỉ người nhận xem được</span>
</div>
</div>
</section>
