name: inkstamp
description: Turn moments into collectible aesthetic stamps.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: 18.0.0
  intl: ^0.20.3
  uuid: ^4.6.0
  camera: ^0.12.0+2
  firebase_core: 4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: 6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0
  firebase_app_check: 0.4.6
  firebase_analytics: 12.4.6
  firebase_crashlytics: ^5.2.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.8.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/design/
    - assets/image_test/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
