name: inkstamp
description: Turn moments into collectible aesthetic stamps.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: ^0.20.3
  uuid: ^4.6.0
  camera: ^0.12.0+2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  cloud_functions: ^6.3.6
  firebase_messaging: ^16.5.0
  firebase_app_check: ^0.4.6
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
